name = "insighthunter-auth"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false

routes = [
  { pattern = "auth.insighthunter.app/*", zone_name = "insighthunter.app" }
]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "insighthunter-auth-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "USER_VAULT"
class_name = "UserVault"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserVault"]

# Secrets (set via `wrangler secret put`, never committed):
#   SESSION_SECRET   - HMAC signing key for session tokens
#
# Plain vars:
[vars]
ALLOWED_ORIGIN = "https://insighthunter.app"
