name = "insighthunter-payments"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false

routes = [
  { pattern = "payments.insighthunter.app/*", zone_name = "insighthunter.app" }
]

[observability]
enabled = true

# Same physical D1 database as insighthunter-auth — this worker only ever
# writes to `users.tier`, `users.stripe_*`, `entitlements`, and
# `billing_events`. It never touches per-user financial data (that stays in
# each user's UserVault Durable Object, which this worker has no binding to).
[[d1_databases]]
binding = "DB"
database_name = "insighthunter-auth-db"
database_id = "REPLACE_WITH_SAME_D1_DATABASE_ID_AS_AUTH"

[vars]
ALLOWED_ORIGIN = "https://insighthunter.app"
APP_BASE_URL = "https://app.insighthunter.app"
AUTH_VERIFY_URL = "https://auth.insighthunter.app/session/verify"

# Stripe Price IDs — plain vars are fine (not secret), rotate via redeploy
# or move to KV-backed config later if you want zero-deploy price changes.
STRIPE_PRICE_STANDARD = "price_REPLACE_ME"
STRIPE_PRICE_PRO = "price_REPLACE_ME"
STRIPE_PRICE_PAYROLL = "price_REPLACE_ME"
STRIPE_PRICE_PBX = "price_REPLACE_ME"
STRIPE_PRICE_INSIGHTS_PRO = "price_REPLACE_ME"
STRIPE_PRICE_BIZFORMA_COMPLIANCE = "price_REPLACE_ME"

# Secrets (set via `wrangler secret put`, never committed):
#   STRIPE_SECRET_KEY     - sk_live_... / sk_test_...
#   STRIPE_WEBHOOK_SECRET - whsec_... from the Stripe webhook endpoint config
