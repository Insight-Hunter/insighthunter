name = "insighthunter-bookkeeping"
main = "src/bookkeeping-worker.ts"
compatibility_date = "2026-08-01"
workers_dev = false

routes = [
  { pattern = "bookkeeping.insighthunter.app/*", zone_name = "insighthunter.app" }
]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "BookkeepingLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BookkeepingLedger"]

[ai]
binding = "AI"

[vars]
AUTH_API_URL = "https://auth.insighthunter.app"
ALLOWED_ORIGIN = "https://app.insighthunter.app"
