name = "insighthunter-payments"
main = "src/index.ts"
compatibility_date = "2026-07-25"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "payments.insighthunter.app/*"
zone_name = "insighthunter.app"

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "insighthunter-auth-db"
database_id = "1b58d27d-77c0-481d-a490-0c043f0e063c"

[[kv_namespaces]]
binding = "KV_ENTITLEMENTS"
id = "f55ebc7692604c949033c9bbc459d6fd"

[vars]
DASHBOARD_URL = "https://app.insighthunter.app"
AUTH_VERIFY_URL = "https://auth.insighthunter.app/session/verify"
ALLOWED_ORIGIN = "https://insighthunter.app"
APP_BASE_URL = "https://app.insighthunter.app"

# Stripe Price IDs are identifiers, not credentials. Keep the Stripe secret
# and webhook signing secret in `wrangler secret`, never in this file.
STRIPE_PRICE_STANDARD = "price_1TBfZoF3gri2YoH2g9u0mqkI"
STRIPE_PRICE_PRO = "price_1TBfZoF3gri2YoH2qpiUybBY"
STRIPE_PRICE_PAYROLL = "price_PAYROLL_ID"
STRIPE_PRICE_PBX = "price_PBX_ID"
STRIPE_PRICE_INSIGHTS_PRO = "price_INSIGHTS_PRO_ID"
STRIPE_PRICE_BIZFORMA_COMPLIANCE = "price_BIZFORMA_ID"

# Secrets (set via wrangler secret put):
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET

[dev]
inspector_port = 9241
