name = "insighthunter-payments"
main = "src/index.ts"
compatibility_date = "2026-07-25"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "payments.insighthunter.app/*"
zone_name = "insighthunter.app"

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "insighthunter-auth-db"
database_id = "1b58d27d-77c0-481d-a490-0c043f0e063c"

[[kv_namespaces]]
binding = "KV_ENTITLEMENTS"
id = "f55ebc7692604c949033c9bbc459d6fd"

[vars]
DASHBOARD_URL = "https://app.insighthunter.app"

# Secrets (set via wrangler secret put):
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET

[dev]
inspector_port = 9241

# Revenue-flow service endpoints
AUTH_VERIFY_URL = "https://auth.insighthunter.app/session/verify"
ALLOWED_ORIGIN = "https://insighthunter.app"
APP_BASE_URL = "https://app.insighthunter.app"

# Replace each placeholder with its matching LIVE recurring Stripe Price ID before deploy.
STRIPE_PRICE_STANDARD = "REPLACE_WITH_LIVE_STANDARD_PRICE_ID"
STRIPE_PRICE_PRO = "REPLACE_WITH_LIVE_PRO_PRICE_ID"
STRIPE_PRICE_PAYROLL = "REPLACE_WITH_LIVE_PAYROLL_PRICE_ID"
STRIPE_PRICE_PBX = "REPLACE_WITH_LIVE_PBX_PRICE_ID"
STRIPE_PRICE_INSIGHTS_PRO = "REPLACE_WITH_LIVE_INSIGHTS_PRO_PRICE_ID"
STRIPE_PRICE_BIZFORMA_COMPLIANCE = "REPLACE_WITH_LIVE_BIZFORMA_COMPLIANCE_PRICE_ID"
