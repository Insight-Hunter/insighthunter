name = "insighthunter-payments"
main = "src/index.ts"
compatibility_date = "2026-07-25"

[[routes]]
pattern = "payments.insighthunter.app/*"
zone_name = "insighthunter.app"

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "insighthunter-auth-db"
database_id = "1b58d27d-77c0-481d-a490-0c043f0e063c"

[vars]
DASHBOARD_URL = "https://app.insighthunter.app"
APP_BASE_URL = "https://app.insighthunter.app"
AUTH_VERIFY_URL = "https://auth.insighthunter.app/session/verify"
ALLOWED_ORIGIN = "https://insighthunter.app"

# Stripe Price IDs are configuration, not credentials. Set these per account.
STRIPE_PRICE_STANDARD = "replace_with_stripe_price_id"
STRIPE_PRICE_PRO = "replace_with_stripe_price_id"
STRIPE_PRICE_PAYROLL = "replace_with_stripe_price_id"
STRIPE_PRICE_PBX = "replace_with_stripe_price_id"
STRIPE_PRICE_INSIGHTS_PRO = "replace_with_stripe_price_id"
STRIPE_PRICE_BIZFORMA_COMPLIANCE = "replace_with_stripe_price_id"

# Secrets (set via wrangler secret put):
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET

[dev]
inspector_port = 9241

# Revenue-flow service endpoints
AUTH_VERIFY_URL = "https://auth.insighthunter.app/session/verify"
ALLOWED_ORIGIN = "https://insighthunter.app"
APP_BASE_URL = "https://app.insighthunter.app"

# Replace each placeholder with its matching LIVE recurring Stripe Price ID before deploy.
STRIPE_PRICE_STANDARD = "price_1TBfZoF3gri2YoH2g9u0mqkI"
STRIPE_PRICE_PRO = "price_1TBfZoF3gri2YoH2qpiUybBY"
STRIPE_PRICE_PAYROLL = "price_PAYROLL_ID"
STRIPE_PRICE_PBX = "price_PBX_ID"
STRIPE_PRICE_INSIGHTS_PRO = "price_INSIGHTS_PRO_ID"
STRIPE_PRICE_BIZFORMA_COMPLIANCE = "price_BIZFORMA_ID"
