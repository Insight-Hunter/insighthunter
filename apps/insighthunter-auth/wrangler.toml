name = "insighthunter-auth"
main = "src/index.ts"
compatibility_date = "2026-09-06"
compatibility_flags = [ "nodejs_compat" ]

[[routes]]
pattern = "auth.insighthunter.app/*"
zone_name = "insighthunter.app"

[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "src/frontend"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = [ "/api/*", "/healthz" ]

[[d1_databases]]
binding = "AUTH_DB"
database_name = "insighthunter-auth-db"
database_id = "1b58d27d-77c0-481d-a490-0c043f0e063c"
migrations_dir = "src/db/migrations"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "60e34ba310ca40c79edec05470c7a271"

[[queues.producers]]
binding = "PROVISIONING_QUEUE"
queue = "insighthunter-provisioning-queue"

[[queues.consumers]]
queue = "insighthunter-provisioning-queue"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 5
dead_letter_queue = "insighthunter-provisioning-dlq"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "RateLimiter" ]

[[analytics_engine_datasets]]
binding = "AUTH_ANALYTICS"
dataset = "insighthunter_auth_events"

[[services]]
binding = "BOOKKEEPING_SERVICE"
service = "insighthunter-bookkeeping"

[vars]
MARKETING_ORIGIN = "https://insighthunter.app"
APP_ORIGIN = "https://app.insighthunter.app"
ACCESS_TOKEN_TTL_SECONDS = "900"
REFRESH_TOKEN_TTL_SECONDS = "2592000"

[[durable_objects.bindings]]
name = "USER_VAULT"
class_name = "UserVault"

[[durable_objects.bindings]]
name = "USER_VAULT"
class_name = "UserVault"

[[migrations]]
tag = "v2"
renamed_classes = []
