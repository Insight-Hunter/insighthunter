name = "insighthunter-auth"
main = "src/index.ts"
compatibility_date = "2026-07-06"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "auth.insighthunter.app"
zone_name = "insighthunter.app"
custom_domain = true

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "insighthunter-auth-db"
database_id = "1b58d27d-77c0-481d-a490-0c043f0e063c"

[vars]
APP_BASE_URL = "https://auth.insighthunter.app"

[dev]
port = 8787
local_protocol = "http"

[[kv_namespaces]]
binding = "SESSIONS"
id = "60e34ba310ca40c79edec05470c7a271"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "8ac9bbaeda4d410db31878ebb8b8a3f1"

# Secrets (set via wrangler secret put):
# JWT_SECRET
# RESEND_API_KEY
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
