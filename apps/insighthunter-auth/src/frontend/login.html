<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Insight Hunter</title>
<style>
  :root{--bg:#0f172a;--card:#111827;--accent:#22c55e;--text:#e5e7eb;--muted:#94a3b8;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);}
  .card{width:100%;max-width:380px;background:var(--card);border:1px solid #1f2937;border-radius:12px;padding:32px;}
  h1{font-size:20px;margin:0 0 4px;}
  p.sub{color:var(--muted);font-size:13px;margin:0 0 24px;}
  label{display:block;font-size:13px;margin-bottom:6px;color:var(--muted);}
  input{width:100%;padding:10px 12px;margin-bottom:16px;background:#0b1220;border:1px solid #1f2937;
    border-radius:8px;color:var(--text);font-size:14px;}
  input:focus{outline:none;border-color:var(--accent);}
  button{width:100%;padding:11px;background:var(--accent);color:#052e16;font-weight:600;border:none;
    border-radius:8px;font-size:14px;cursor:pointer;}
  button:hover{opacity:.9;}
  .err{color:#f87171;font-size:13px;margin-bottom:12px;display:none;}
  .foot{margin-top:18px;text-align:center;font-size:13px;color:var(--muted);}
  .foot a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <h1>Sign in to Insight Hunter</h1>
    <p class="sub">Access your bookkeeping and finance dashboard.</p>
    <div id="error" class="err"></div>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign In</button>
    </form>
    <div class="foot">No account? <a href="/register">Create one</a></div>
  </div>
<script>
  const form = document.getElementById('loginForm');
  const errBox = document.getElementById('error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.style.display = 'none';
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Invalid email or password.');
      window.location.href = data.redirect || 'https://app.insighthunter.app';
    } catch (err) {
      errBox.textContent = err.message || 'Something went wrong.';
      errBox.style.display = 'block';
    }
  });
</script>
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Insight Hunter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f7f6f2; --surface: #ffffff; --text: #28251d; --muted: #7a7974;
      --primary: #01696f; --primary-hover: #0c4e54; --border: #d4d1ca;
      --error: #a12c7b; --radius: 0.5rem; --shadow: 0 4px 24px rgba(0,0,0,.08);
      font-family: system-ui, sans-serif; font-size: 16px;
    }
    body { min-height: 100dvh; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { background: var(--surface); border-radius: 1rem; box-shadow: var(--shadow); padding: 2.5rem 2rem; width: 100%; max-width: 420px; }
    .logo { display: flex; align-items: center; gap: .5rem; margin-bottom: 2rem; }
    .logo svg { color: var(--primary); }
    .logo-text { font-size: 1.1rem; font-weight: 700; color: var(--text); letter-spacing: -.02em; }
    h1 { font-size: 1.4rem; font-weight: 700; color: var(--text); margin-bottom: .25rem; }
    .subtitle { color: var(--muted); font-size: .95rem; margin-bottom: 1.75rem; }
    label { display: block; font-size: .875rem; font-weight: 500; color: var(--text); margin-bottom: .375rem; }
    input { display: block; width: 100%; padding: .625rem .875rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: 1rem; color: var(--text); background: #fff; transition: border-color .15s, box-shadow .15s; }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(1,105,111,.15); }
    .field { margin-bottom: 1.1rem; }
    .btn { display: block; width: 100%; padding: .7rem 1rem; background: var(--primary); color: #fff; border: none; border-radius: var(--radius); font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .15s; margin-top: 1.5rem; min-height: 44px; }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .error-msg { display: none; color: var(--error); font-size: .875rem; margin-top: 1rem; padding: .625rem .875rem; border-radius: var(--radius); background: rgba(161,44,123,.07); }
    .error-msg.visible { display: block; }
    .footer-link { text-align: center; margin-top: 1.5rem; font-size: .875rem; color: var(--muted); }
    .footer-link a { color: var(--primary); text-decoration: none; font-weight: 500; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card" role="main">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <circle cx="14" cy="14" r="13" stroke="currentColor" stroke-width="2"/>
        <path d="M9 14h10M14 9v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">Insight Hunter</span>
    </div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account</p>
    <form id="form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" name="email" autocomplete="email" required placeholder="you@company.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required placeholder="Your password" />
      </div>
      <div class="error-msg" id="error" role="alert" aria-live="polite"></div>
      <button type="submit" class="btn" id="btn">Sign in</button>
    </form>
    <p class="footer-link">Don&rsquo;t have an account? <a href="/register">Create one</a></p>
  </div>
  <script type="module">
    const form = document.getElementById('form');
    const btn  = document.getElementById('btn');
    const err  = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.className = 'error-msg';
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            email: form.email.value.trim(),
            password: form.password.value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message ?? 'Login failed');
        sessionStorage.setItem('ih_at', data.accessToken);
        window.location.href = 'https://app.insighthunter.app/dashboard';
      } catch (ex) {
        err.textContent = ex instanceof Error ? ex.message : 'An unexpected error occurred.';
        err.className = 'error-msg visible';
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
