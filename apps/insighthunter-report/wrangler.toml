name = "insighthunter-report"
main = "src/index.ts"
compatibility_date = "2026-08-23"

[[routes]]
pattern = "reports.insighthunter.app/*"
zone_name = "insighthunter.app"

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "insighthunter-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
AUTH_URL = "https://auth.insighthunter.app"
DASHBOARD_URL = "https://app.insighthunter.app"
ENVIRONMENT = "production"
