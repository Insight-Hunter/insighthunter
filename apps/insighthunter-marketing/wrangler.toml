name = "insighthunter-marketing"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "insighthunter.app/*", zone_name = "insighthunter.app" },
  { pattern = "www.insighthunter.app/*", zone_name = "insighthunter.app" }
]

[assets]
directory = "./dist/client"
binding = "ASSETS"

[[kv_namespaces]]
binding = "LEADS"
id = "3f9b5938564948569f7ce8d73cac769e"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "1a34ccfa48cd47bab83eef40c5586945"

[observability]
enabled = true

# Public runtime config — no secrets here, these are read by client-side
# scripts (pricing/signup/login pages) via import.meta.env at build time.
[vars]
PUBLIC_AUTH_API_URL = "https://auth.insighthunter.app"
PUBLIC_PAYMENTS_API_URL = "https://payments.insighthunter.app"
PUBLIC_APP_BASE_URL = "https://dashboard.insighthunter.app"
