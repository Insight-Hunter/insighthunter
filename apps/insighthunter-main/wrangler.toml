# insighthunter-main — Dashboard Worker (app.insighthunter.app)
# This deploys src/index.ts as a Cloudflare Worker via: wrangler deploy
# The Astro marketing site (insighthunter.app) is deployed separately via Pages.

name = "insighthunter-main"
main = "src/index.ts"
compatibility_date = "2026-08-03"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1.0

[[routes]]
pattern = "app.insighthunter.app/*"
zone_name = "insighthunter.app"

[vars]
APP_ENV        = "production"
APP_URL        = "https://insighthunter.app"
AUTH_WORKER_URL = "https://auth.insighthunter.app"
AUTH_URL       = "https://auth.insighthunter.app"
DASHBOARD_URL  = "https://app.insighthunter.app"
ENVIRONMENT    = "production"

[[d1_databases]]
binding       = "DB"
database_name = "insighthunter-main"
database_id   = "04854880-81f5-4c02-b555-905a34492b92"

[[kv_namespaces]]
binding = "SESSION"
id = "98e830f284eb4c58b372d8fc34497146"

[[kv_namespaces]]
binding    = "SESSION_KV"
id         = "88a8b6dd2b464effa9025e3f0020cc5e"
preview_id = "9705276c312c48a7a83270766c1a1c9e"

[[kv_namespaces]]
binding = "KV_SESSIONS"
id      = "084631d3b2704097a57e57d89daee600"

[[kv_namespaces]]
binding    = "FLAGS_KV"
id         = "28474b5f5f064190b051c99ce50b68e8"
preview_id = "28474b5f5f064190b051c99ce50b68e8"

[[r2_buckets]]
binding     = "ASSETS_BUCKET"
bucket_name = "insighthunter-assets"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "insighthunter_events"

[[services]]
binding = "AUTH_WORKER"
service = "insighthunter-auth"

[[services]]
binding = "BOOKKEEPING_WORKER"
service = "insighthunter-bookkeeping"

[[services]]
binding = "BIZFORMA_WORKER"
service = "insighthunter-bizforma"

# Preview env
[env.preview.vars]
APP_ENV        = "preview"
APP_URL        = "https://preview.insighthunter.app"
AUTH_WORKER_URL = "https://auth.insighthunter.app"
AUTH_URL       = "https://auth.insighthunter.app"
DASHBOARD_URL  = "https://app.insighthunter.app"
ENVIRONMENT    = "preview"

# Local dev — use .dev.vars instead of [env.local] (not valid in wrangler)
